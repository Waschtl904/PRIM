[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prim"
version = "0.1.0"
authors = [{name = "Sebastian Waschtl", email = "your.email@example.com"}]
description = "Modulares Framework für Primzahltests und -analysen"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.5.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-mock>=3.10.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["prim", "prim.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=prim",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--strict-markers"
]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow",
    "benchmark: marks tests as benchmarks",
    "integration: marks tests as integration tests"
]

[tool.coverage.run]
source = ["src/prim"]
omit = ["*/tests/*", "*/__pycache__/*", "*/build/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError"
]

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | docs
  | native
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.flake8]
extend-select = ["ANN"]
max-line-length = 88
extend-ignore = [
  "E203",  # Konflikt mit Black
  "W503",  # Konflikt mit Black
  "F401",  # Unbenutzte Importe
  "F841",  # Unbenutzte Variablen
]
exclude = [
  ".venv",
  "build",
  "dist",
  "__pycache__",
  "docs",
  "native",
  "benchmarks/benchmark_results.json",
  "*.old"
]

[tool.mypy]
python_version = 3.8
strict = false
ignore_missing_imports = true
files = "src/prim"
